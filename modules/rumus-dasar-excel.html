  <div id="konten-utama">
    <h1>🧮 Rumus Dasar Excel: SUM & AVERAGE</h1>
    <p>Contoh data nilai ujian:</p>
    <table>
      <tr><th>Nama</th><th>Nilai</th></tr>
      <tr><td>Andi</td><td>80</td></tr>
      <tr><td>Budi</td><td>75</td></tr>
      <tr><td>Citra</td><td>90</td></tr>
    </table>
    <p style="margin-top:16px">Coba hitung sendiri: <code>=SUM(B2:B4)</code> dan <code>=AVERAGE(B2:B4)</code></p>
    <p class="hasil">SUM = 245 &nbsp;|&nbsp; AVERAGE = 81.67</p>
