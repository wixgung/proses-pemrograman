<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Membuat Grafik & Visualisasi Data</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#0B1120;color:#E7ECF5;padding:0;margin:0}
  #konten-utama{visibility:hidden;padding:40px;max-width:600px;margin:0 auto}
  .bar-chart{display:flex;align-items:flex-end;gap:14px;height:160px;margin:24px 0;border-bottom:2px solid #253352;padding-bottom:2px}
  .bar{background:linear-gradient(180deg,#34D399,#059669);border-radius:4px 4px 0 0;flex:1;position:relative}
  .bar span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;color:#93A1BF}
  a{color:#34D399}
</style>
</head>
<body>
  <div id="konten-utama">
    <h1>📈 Membuat Grafik & Visualisasi Data</h1>
    <p>Contoh grafik batang penjualan per bulan:</p>
    <div class="bar-chart">
      <div class="bar" style="height:60%"><span>Jan</span></div>
      <div class="bar" style="height:80%"><span>Feb</span></div>
      <div class="bar" style="height:45%"><span>Mar</span></div>
      <div class="bar" style="height:95%"><span>Apr</span></div>
    </div>
    <p>Di Excel, ini dibuat lewat: blok data &rarr; tab <b>Insert</b> &rarr; <b>Chart</b> &rarr; pilih jenis grafik.</p>
    <p>Ganti file ini dengan materi visualisasi data Anda sendiri.</p>
    <p><a href="../index.html">&larr; Kembali ke Portal</a></p>
  </div>

  <script>const MODUL_ID = "XII-201";</script>
  <script src="../config.js"></script>
  <script src="../guard.js"></script>
</body>
</html>
