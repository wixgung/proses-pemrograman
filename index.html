<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informatika Kelas XII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --bg: #FFFFFF;
    --bg-sidebar: #FBFBFA;
    --text: #37352F;
    --muted: #787774;
    --border: #EBEBEA;
    --hover: #F1F1EF;
    --accent: #2383E2;
    --accent-soft: #E7F3FE;
    --sidebar-w: 260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
    font-size:15px;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    padding:14px 12px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    overflow-x:hidden;
    transition:width .16s ease, padding .16s ease;
    white-space:nowrap;
  }
  #sidebar.collapsed{width:0;padding-left:0;padding-right:0;border-right:none}
  #sidebar.collapsed *{opacity:0;pointer-events:none}

  .sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 14px}
  .ws-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  #collapse-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:5px;line-height:1}
  #collapse-btn:hover{background:var(--hover)}

  #open-sidebar-btn{
    display:none;position:fixed;top:16px;left:14px;z-index:15;
    background:#fff;border:1px solid var(--border);border-radius:6px;
    padding:7px 9px;font-size:14px;cursor:pointer;color:var(--muted);
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  #open-sidebar-btn.show{display:block}

  #cari-wrap{padding:0 4px 14px}
  #cari{
    width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;
    font-family:inherit;font-size:13px;background:#fff;color:var(--text);
  }
  #cari:focus{outline:none;border-color:var(--accent)}
  .nav-item{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
    color:var(--muted);font-size:13.5px;cursor:pointer;font-weight:500;user-select:none;
  }
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent)}
  .nav-section-label{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    padding:14px 8px 4px;font-weight:600;
  }
  .nav-sub{
    display:flex;align-items:center;gap:8px;
    padding:5px 8px;margin-left:18px;font-size:13px;color:var(--muted);
    border-radius:6px;cursor:pointer;
  }
  .nav-sub:hover{background:var(--hover)}
  .nav-sub.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .kat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .sidebar-footer{
    margin-top:22px;padding:12px 10px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--muted);line-height:1.5;
  }

  /* ---------- MAIN ---------- */
  main{flex:1;max-width:980px;margin:0 auto;padding:40px 48px 100px;min-width:0}

  /* Hero banner */
  .hero{
    position:relative;
    height:150px;
    border-radius:18px;
    background:linear-gradient(120deg,#E4E9FF 0%,#EDE6FF 45%,#E6F2FF 100%);
    overflow:hidden;
    margin-bottom:52px;
  }
  .hero .blob{position:absolute;border-radius:50%;background:#fff;opacity:.28}
  .hero .blob.b1{width:230px;height:230px;top:-90px;right:-50px}
  .hero .blob.b2{width:150px;height:150px;bottom:-80px;left:22%;opacity:.22}
  .hero .blob.b3{width:90px;height:90px;top:20px;right:120px;opacity:.35}
  .hero-icon{
    position:absolute;bottom:-26px;left:32px;
    width:74px;height:74px;background:#fff;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:0 6px 16px rgba(55,45,30,.12);
  }

  .title-block{margin-top:40px;padding-left:2px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .page-meta{color:var(--muted);font-size:14px;margin-top:6px}

  .stats-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .stat-pill{
    display:flex;align-items:center;gap:6px;background:var(--hover);
    padding:6px 13px;border-radius:20px;font-size:12.5px;color:var(--muted);font-weight:500;
  }
  .stat-pill b{color:var(--text);font-weight:700;font-size:13px}

  .divider{border:none;border-top:1px solid var(--border);margin:30px 0 30px}

  .semester-block{margin-bottom:36px}
  .semester-header{
    display:flex;align-items:center;gap:9px;padding:8px 4px;border-radius:6px;
    cursor:pointer;font-weight:700;font-size:16.5px;margin-bottom:16px;
  }
  .semester-header:hover{background:var(--hover)}
  .chevron{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;width:14px}
  .semester-header.collapsed .chevron{transform:rotate(-90deg)}
  .semester-count{color:var(--muted);font-weight:400;font-size:13px}

  /* ---------- GALLERY CARDS ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card{
    border:1px solid var(--border);border-radius:14px;overflow:hidden;
    text-decoration:none;color:var(--text);background:#fff;
    display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(55,45,30,.10)}
  .card-image{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--hover)}
  .card-image-fallback{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:42px}

  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
  .card-title-row{display:flex;align-items:center;gap:7px}
  .card-icon{font-size:14px;flex-shrink:0}
  .card-title{
    font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.3;
  }
  .card-desc{
    font-size:12px;color:var(--muted);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.6em;
  }
  .card-pill{
    align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;padding:3px 10px;border-radius:20px;
  }

  .skeleton-card{
    aspect-ratio:4/3;border-radius:14px;
    background:linear-gradient(90deg,#F1F1EF 25%,#E9E9E7 37%,#F1F1EF 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease infinite;
    border:1px solid var(--border);
  }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  .kosong{color:var(--muted);font-size:13.5px;padding:16px 4px}

  #menu-btn{display:none}
  @media (max-width:820px){
    #sidebar{
      position:fixed;left:-280px;z-index:20;width:260px;
      transition:left .18s;box-shadow:0 0 0 2000px rgba(0,0,0,0);
    }
    #sidebar.open{left:0;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
    #sidebar.open *{opacity:1;pointer-events:auto}
    #sidebar.collapsed{width:260px;padding:14px 12px}
    #collapse-btn{display:none}
    #open-sidebar-btn{display:none !important}
    #menu-btn{
      display:flex;align-items:center;gap:6px;position:fixed;top:14px;left:14px;z-index:10;
      background:#fff;border:1px solid var(--border);border-radius:6px;
      padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit;
    }
    main{padding:70px 20px 80px}
    .hero{height:120px}
    .gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }
</style>
</head>
<body>

<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
<button id="open-sidebar-btn" onclick="bukaSidebar()">☰</button>

<nav id="sidebar">
  <div class="sidebar-top">
    <div class="ws-title">💻 Informatika XII</div>
    <button id="collapse-btn" onclick="tutupSidebar()" title="Tutup sidebar">«</button>
  </div>
  <div id="cari-wrap">
    <input id="cari" type="text" placeholder="Cari materi...">
  </div>
  <div class="nav-item active" data-filter="semua">🏠 Semua Materi</div>

  <div class="nav-section-label">Semester 1</div>
  <div id="nav-s1"></div>

  <div class="nav-section-label">Semester 2</div>
  <div id="nav-s2"></div>

  <div class="sidebar-footer">Portal belajar Informatika Kelas XII. Materi diperbarui berkala oleh guru.</div>
</nav>

<main>
  <div class="hero">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="hero-icon">💻</div>
  </div>

  <div class="title-block">
    <h1>Informatika Kelas XII</h1>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <hr class="divider">

  <div id="konten">
    <div class="gallery">
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>
  </div>
</main>

<script>
let semuaModul = [];
let filterAktif = 'semua';
let kategoriAktif = null;
let collapsedState = {};

const GRADIENTS = [
  'linear-gradient(135deg,#FDE9C8,#FBCFE8)',
  'linear-gradient(135deg,#D7F2E3,#BAE6C9)',
  'linear-gradient(135deg,#DDEBFF,#C7DDFF)',
  'linear-gradient(135deg,#FFE8D6,#FFD3B0)',
  'linear-gradient(135deg,#E9E3FF,#D6CCFF)',
  'linear-gradient(135deg,#FFE0E8,#FFC2D1)'
];

const PALETTE = [
  {bg:'#FEF3E2', text:'#B45309', dot:'#F59E0B'},
  {bg:'#E6F7EE', text:'#047857', dot:'#10B981'},
  {bg:'#E8F1FF', text:'#1D4ED8', dot:'#3B82F6'},
  {bg:'#FDE8F0', text:'#BE185D', dot:'#EC4899'},
  {bg:'#F1ECFF', text:'#6D28D9', dot:'#8B5CF6'},
  {bg:'#FFEEE0', text:'#C2410C', dot:'#F97316'}
];

function warnaKategori(kat){
  let hash = 0;
  for(let i=0;i<(kat||'').length;i++) hash = kat.charCodeAt(i) + ((hash<<5)-hash);
  return PALETTE[Math.abs(hash) % PALETTE.length];
}

function tutupSidebar(){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('open-sidebar-btn').classList.add('show');
  localStorage.setItem('sidebarCollapsedXII', '1');
}
function bukaSidebar(){
  document.getElementById('sidebar').classList.remove('collapsed');
  document.getElementById('open-sidebar-btn').classList.remove('show');
  localStorage.setItem('sidebarCollapsedXII', '0');
}
if(localStorage.getItem('sidebarCollapsedXII') === '1' && window.innerWidth > 820){
  tutupSidebar();
}

async function muatData(){
  try{
    const res = await fetch(CONTROL_URL + '?t=' + Date.now());
    const semuaBaris = await res.json();
    semuaModul = semuaBaris.filter(m => m.tampilkan === true);
    buatNavKategori();
    buatStats();
    render();
  }catch(err){
    document.getElementById('konten').innerHTML =
      '<p class="kosong">Gagal memuat data dari Google Sheet. Pastikan CONTROL_URL di config.js sudah diisi dan Apps Script sudah di-deploy.</p>';
    console.error(err);
  }
}

function buatStats(){
  const s1 = semuaModul.filter(m=>m.semester==='1').length;
  const s2 = semuaModul.filter(m=>m.semester==='2').length;
  const kategori = new Set(semuaModul.map(m=>m.category)).size;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-pill">📚 <b>${semuaModul.length}</b> materi</div>
    <div class="stat-pill">🧩 <b>${kategori}</b> kategori</div>
    <div class="stat-pill">📗 Semester 1: <b>${s1}</b></div>
    <div class="stat-pill">📘 Semester 2: <b>${s2}</b></div>
  `;
}

function buatNavKategori(){
  const kategoriS1 = [...new Set(semuaModul.filter(m=>m.semester==='1').map(m=>m.category))];
  const kategoriS2 = [...new Set(semuaModul.filter(m=>m.semester==='2').map(m=>m.category))];

  const buatItem = (k, sem) => {
    const w = warnaKategori(k);
    return `<div class="nav-sub" data-sem="${sem}" data-kat="${k}"><span class="kat-dot" style="background:${w.dot}"></span>${k}</div>`;
  };

  document.getElementById('nav-s1').innerHTML = kategoriS1.map(k => buatItem(k,'1')).join('')
    || '<div class="nav-sub" style="opacity:.5">Belum ada materi</div>';

  document.getElementById('nav-s2').innerHTML = kategoriS2.map(k => buatItem(k,'2')).join('')
    || '<div class="nav-sub" style="opacity:.5">Belum ada materi</div>';

  document.querySelectorAll('.nav-sub').forEach(el=>{
    el.onclick = ()=>{
      filterAktif = el.dataset.sem;
      kategoriAktif = el.dataset.kat;
      setActiveNav(el);
      render();
    };
  });

  document.querySelector('.nav-item[data-filter="semua"]').onclick = (e)=>{
    filterAktif = 'semua';
    kategoriAktif = null;
    setActiveNav(e.currentTarget);
    render();
  };
}

function setActiveNav(el){
  document.querySelectorAll('.nav-item, .nav-sub').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(window.innerWidth<=820) document.getElementById('sidebar').classList.remove('open');
}

function render(){
  const kataKunci = document.getElementById('cari').value.toLowerCase();

  const cocok = (m) => {
    const cocokSem = filterAktif==='semua' || m.semester===filterAktif;
    const cocokKat = !kategoriAktif || m.category===kategoriAktif;
    const cocokCari = m.title.toLowerCase().includes(kataKunci) || (m.description||'').toLowerCase().includes(kataKunci);
    return cocokSem && cocokKat && cocokCari;
  };

  const hasil = semuaModul.filter(cocok);
  const grup1 = hasil.filter(m=>m.semester==='1');
  const grup2 = hasil.filter(m=>m.semester==='2');

  let html = '';
  html += buatBlokSemester('1', 'Semester 1', grup1, '📗');
  html += buatBlokSemester('2', 'Semester 2', grup2, '📘');

  if(hasil.length===0){
    html = '<p class="kosong">Tidak ada materi yang cocok dengan pencarian.</p>';
  }

  document.getElementById('konten').innerHTML = html;

  document.querySelectorAll('.semester-header').forEach(h=>{
    h.onclick = ()=>{
      const key = h.dataset.sem;
      collapsedState[key] = !collapsedState[key];
      render();
    };
  });
}

function buatKartu(m, idx){
  const gradien = GRADIENTS[idx % GRADIENTS.length];
  const gambar = (m.image || '').trim();
  const warna = warnaKategori(m.category);

  const gambarHtml = gambar
    ? `<img class="card-image" src="${gambar}" alt="${m.title}" loading="lazy"
         onerror="this.outerHTML='<div class=&quot;card-image-fallback&quot; style=&quot;background:${gradien}&quot;>${m.icon || '📄'}</div>'">`
    : `<div class="card-image-fallback" style="background:${gradien}">${m.icon || '📄'}</div>`;

  return `
    <a class="card" href="${m.file}" target="_blank" rel="noopener">
      ${gambarHtml}
      <div class="card-body">
        <div class="card-title-row">
          <span class="card-icon">${m.icon || '📄'}</span>
          <span class="card-title">${m.title}</span>
        </div>
        <p class="card-desc">${m.description || ''}</p>
        <span class="card-pill" style="background:${warna.bg};color:${warna.text}">${m.category || ''}</span>
      </div>
    </a>
  `;
}

function buatBlokSemester(kode, label, daftar, emoji){
  if(filterAktif!=='semua' && filterAktif!==kode) return '';
  const collapsed = collapsedState[kode] ? 'collapsed' : '';
  const kartu = daftar.length
    ? `<div class="gallery">${daftar.map((m,i)=>buatKartu(m,i)).join('')}</div>`
    : '<p class="kosong">Belum ada materi di semester ini.</p>';

  return `
    <div class="semester-block">
      <div class="semester-header ${collapsed}" data-sem="${kode}">
        <span class="chevron">▾</span>
        <span>${emoji} ${label}</span>
        <span class="semester-count">${daftar.length} materi</span>
      </div>
      <div style="${collapsedState[kode] ? 'display:none' : ''}">
        ${kartu}
      </div>
    </div>
  `;
}

document.getElementById('cari').addEventListener('input', render);
muatData();
</script>

</body>
</html>
